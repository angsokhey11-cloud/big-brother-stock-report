<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>BIG BROTHER — Batch Report Mobile</title>
  <link rel="stylesheet" href="batch-v2.css?v=20260910-1">
  <style>
    :root{--bb-mobile-bg:#eef3f8}
    html,body{width:100%;max-width:100%;overflow-x:hidden;background:var(--bb-mobile-bg)}
    body{min-width:0!important;padding-bottom:18px}
    .page{width:100%;max-width:760px;margin:0 auto;padding:8px!important}
    .top{display:grid!important;grid-template-columns:minmax(0,1fr) auto;align-items:center!important;gap:8px!important;margin-bottom:8px!important}
    .top h1{font-size:18px!important;line-height:1.15;margin:0!important}
    .sub{margin-top:3px!important;font-size:8px!important;line-height:1.3!important}
    .top-actions{display:flex!important;gap:5px!important;margin:0!important;align-items:center!important}
    .secure{padding:5px 7px!important;font-size:7px!important}
    .btn{min-height:34px!important;padding:6px 9px!important;border-radius:8px!important;font-size:8px!important}

    .kpis{grid-template-columns:repeat(2,minmax(0,1fr))!important;gap:6px!important;margin-bottom:7px!important}
    .kpi{padding:8px!important;border-radius:10px!important;box-shadow:none!important}
    .kpi span{font-size:6.5px!important;line-height:1.2!important}
    .kpi strong{margin-top:4px!important;font-size:16px!important}

    .card{border-radius:11px!important;box-shadow:none!important;overflow:visible!important;background:transparent!important;border:0!important}
    .toolbar{display:grid!important;grid-template-columns:minmax(0,1fr) 112px!important;gap:5px!important;padding:7px!important;border:1px solid var(--line)!important;border-radius:10px!important;background:#fff!important;margin-bottom:6px!important}
    .toolbar input,.toolbar select{min-height:35px!important;padding:6px 8px!important;border-radius:8px!important;font-size:9px!important;min-width:0!important}
    .sync{grid-column:1/-1!important;text-align:left!important;font-size:7px!important;padding-left:2px!important}

    .card>.tablewrap{overflow:visible!important}
    .card>.tablewrap>table{display:block!important;width:100%!important;min-width:0!important}
    .card>.tablewrap>table>thead{display:none!important}
    .card>.tablewrap>table>tbody{display:block!important;width:100%!important}
    .card>.tablewrap>table>tbody>tr[data-id]{display:grid!important;grid-template-columns:repeat(2,minmax(0,1fr))!important;gap:6px!important;width:100%!important;margin:0 0 6px!important;padding:9px!important;border:1px solid var(--line)!important;border-radius:11px!important;background:#fff!important;box-shadow:0 3px 12px rgba(27,61,96,.035)!important}
    .card>.tablewrap>table>tbody>tr[data-id]:active{background:#f6faff!important}
    .card>.tablewrap>table>tbody>tr[data-id]>td{display:block!important;min-width:0!important;padding:0!important;border:0!important;text-align:left!important;font-size:9px!important}
    .card>.tablewrap>table>tbody>tr[data-id]>td::before{display:block;margin-bottom:2px;color:#7b8da0;font-size:6px;font-weight:1000;text-transform:uppercase;letter-spacing:.02em}
    .card>.tablewrap>table>tbody>tr[data-id]>td:nth-child(1){grid-column:1/-1;padding-bottom:6px!important;border-bottom:1px solid #edf1f5!important}
    .card>.tablewrap>table>tbody>tr[data-id]>td:nth-child(1)::before{content:'Batch'}
    .card>.tablewrap>table>tbody>tr[data-id]>td:nth-child(2)::before{content:'Date'}
    .card>.tablewrap>table>tbody>tr[data-id]>td:nth-child(3)::before{content:'Salesman'}
    .card>.tablewrap>table>tbody>tr[data-id]>td:nth-child(4)::before{content:'Location'}
    .card>.tablewrap>table>tbody>tr[data-id]>td:nth-child(5)::before{content:'Sent'}
    .card>.tablewrap>table>tbody>tr[data-id]>td:nth-child(6)::before{content:'Sold'}
    .card>.tablewrap>table>tbody>tr[data-id]>td:nth-child(7)::before{content:'Back'}
    .card>.tablewrap>table>tbody>tr[data-id]>td:nth-child(8)::before{content:'Damage'}
    .card>.tablewrap>table>tbody>tr[data-id]>td:nth-child(9)::before{content:'Remaining'}
    .card>.tablewrap>table>tbody>tr[data-id]>td:nth-child(10)::before{content:'Status'}
    .card>.tablewrap>table>tbody>tr[data-id]>td.num{text-align:left!important}
    .card>.tablewrap .tiny{font-size:7px!important;margin-top:2px!important}
    .card>.tablewrap .remain{font-size:11px!important}
    .card>.tablewrap .badge{padding:4px 7px!important;font-size:7px!important}
    .card>.tablewrap .empty{display:block!important;width:100%!important;padding:22px 10px!important;border:1px solid var(--line)!important;border-radius:10px!important;background:#fff!important;font-size:9px!important}

    .overlay{padding:0!important;align-items:flex-end!important;background:rgba(15,31,50,.55)!important}
    .modal{width:100%!important;max-width:760px!important;max-height:94vh!important;overflow:auto!important;border-radius:16px 16px 0 0!important}
    .modal-head{padding:11px 12px!important;align-items:center!important}
    .modal-head h2{font-size:16px!important}
    .modal-head .sub{font-size:7px!important}
    .x{width:32px!important;height:32px!important;font-size:18px!important}

    .detail-kpis{grid-template-columns:repeat(3,minmax(0,1fr))!important;gap:5px!important;padding:9px!important}
    .detail-kpis>div{padding:7px!important;border-radius:8px!important}
    .detail-kpis span{font-size:6px!important}
    .detail-kpis strong{font-size:12px!important;margin-top:3px!important}
    .detail-kpis .badge{font-size:6px!important;padding:3px 5px!important}

    .section{padding:0 9px 9px!important}
    .section h3{margin:5px 0 6px!important;font-size:11px!important}
    .section .tablewrap{overflow:visible!important}
    .section table{display:block!important;width:100%!important;min-width:0!important}
    .section thead{display:none!important}
    .section tbody{display:block!important;width:100%!important}
    .section tbody tr{display:grid!important;grid-template-columns:repeat(2,minmax(0,1fr))!important;gap:5px!important;margin:0 0 5px!important;padding:8px!important;border:1px solid var(--line)!important;border-radius:9px!important;background:#fbfcfe!important}
    .section tbody tr td{display:block!important;min-width:0!important;padding:0!important;border:0!important;text-align:left!important;font-size:8px!important}
    .section tbody tr td::before{display:block;margin-bottom:2px;color:#7b8da0;font-size:5.5px;font-weight:1000;text-transform:uppercase}
    .section:nth-of-type(2) tbody tr td:nth-child(1){grid-column:1/-1;padding-bottom:5px!important;border-bottom:1px solid #edf1f5!important}
    .section:nth-of-type(2) tbody tr td:nth-child(1)::before{content:'Product'}
    .section:nth-of-type(2) tbody tr td:nth-child(2)::before{content:'Sent'}
    .section:nth-of-type(2) tbody tr td:nth-child(3)::before{content:'Sold'}
    .section:nth-of-type(2) tbody tr td:nth-child(4)::before{content:'Back'}
    .section:nth-of-type(2) tbody tr td:nth-child(5)::before{content:'Damage'}
    .section:nth-of-type(2) tbody tr td:nth-child(6)::before{content:'Other'}
    .section:nth-of-type(2) tbody tr td:nth-child(7)::before{content:'Remaining'}
    .section:nth-of-type(2) tbody tr td:nth-child(8)::before{content:'Status'}
    .section:nth-of-type(3) tbody tr td:nth-child(1){grid-column:1/-1;padding-bottom:5px!important;border-bottom:1px solid #edf1f5!important}
    .section:nth-of-type(3) tbody tr td:nth-child(1)::before{content:'Invoice'}
    .section:nth-of-type(3) tbody tr td:nth-child(2)::before{content:'Date'}
    .section:nth-of-type(3) tbody tr td:nth-child(3)::before{content:'Customer'}
    .section:nth-of-type(3) tbody tr td:nth-child(4)::before{content:'Qty'}
    .section:nth-of-type(3) tbody tr td:nth-child(5)::before{content:'Grand Total'}
    .section .num{text-align:left!important}
    .section .tiny{font-size:6.5px!important}
    .section .badge{font-size:6px!important;padding:3px 5px!important}
    .section .empty{grid-column:1/-1!important;padding:12px!important;text-align:center!important}

    .closed-note{margin:0 9px 9px!important;padding:8px!important;font-size:8px!important}
    .finalize{padding:0 9px calc(10px + env(safe-area-inset-bottom))!important}
    .finalize .btn{width:100%!important;min-width:0!important;min-height:40px!important;font-size:9px!important}

    @media(max-width:360px){
      .page{padding:6px!important}
      .top{grid-template-columns:1fr!important}
      .top-actions{justify-content:flex-start!important}
      .toolbar{grid-template-columns:1fr!important}
      .sync{grid-column:auto!important}
      .detail-kpis{grid-template-columns:repeat(2,minmax(0,1fr))!important}
    }
  </style>
</head>
<body>
<script>window.BB_BATCH_PAGE_MODE='live';</script>
<script src="batch-v2-page.js?v=20260910-2"></script>
</body>
</html>
