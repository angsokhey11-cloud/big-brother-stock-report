const PATCH=String.raw`
(function(){
'use strict';document.body.classList.add('bb-stock-transactions-mobile');
const title=document.querySelector('.brand h1');if(title)title.textContent='📜 Stock In-Out Transactions';
const subtitle=document.querySelector('.brand p');if(subtitle)subtitle.textContent='Complete stock movement history and transaction receipts';

})();
`;
