<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>BIG BROTHER — Damage Stock Report Mobile</title>
<style>

.bb-loader{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}.bb-loader-card{width:min(420px,100%);padding:20px;border:1px solid #d8e3ef;border-radius:14px;background:#fff;box-shadow:0 10px 32px rgba(23,63,119,.10);color:#173f77;font-weight:900;text-align:center}.bb-loader-card span{display:block;margin-top:7px;color:#6d7f93;font-size:11px;font-weight:700}
</style>

<body>
<div class="bb-loader"><div class="bb-loader-card">Loading Damage Stock Report…<span>Existing damage report engine · Mobile workspace</span></div></div>
<script>
(async function(){
'use strict';
const MOBILE_STYLE=String.raw`
:root{--bb-navy:#17457a;--bb-blue:#245fae;--bb-red:#b43a3a;--bb-green:#168652;--bb-amber:#9a6200;--bb-line:#d9e2ef;--bb-muted:#667085;--bb-bg:#eef3f8}
html,body{width:100%!important;max-width:100%!important;min-width:0!important;overflow-x:hidden!important;background:var(--bb-bg)!important}
body{min-width:0!important;padding:0 0 calc(14px + env(safe-area-inset-bottom))!important}.page{width:100%!important;max-width:760px!important;margin:0 auto!important;padding:8px!important}
.top{display:grid!important;grid-template-columns:minmax(0,1fr) auto!important;align-items:center!important;gap:8px!important;margin:0 0 8px!important;padding:4px 2px!important}.title{font-size:20px!important;line-height:1.1!important}.sub{margin-top:3px!important;font-size:8px!important;line-height:1.3!important}.pill{padding:5px 7px!important;font-size:7px!important;margin:0!important}

.card{padding:9px!important;margin-bottom:8px!important;border-radius:12px!important;box-shadow:none!important}.card-title{display:grid!important;grid-template-columns:minmax(0,1fr) auto!important;align-items:center!important;gap:6px!important;margin-bottom:7px!important}.card-title strong{font-size:12px!important}.controls{display:flex!important;gap:5px!important;align-items:center!important;flex-wrap:nowrap!important}.controls input,.controls select{width:100%!important;min-width:0!important;min-height:35px!important;padding:6px 8px!important;border-radius:8px!important;font-size:9px!important}.controls input{min-width:0!important}.btn{min-height:35px!important;padding:6px 9px!important;border-radius:8px!important;font-size:8px!important}.card:first-of-type .controls{width:min(280px,55vw)!important}.card:first-of-type .controls input{flex:1 1 auto!important}.card:first-of-type #refreshBtn{width:36px!important;min-width:36px!important;font-size:0!important;padding:0!important}.card:first-of-type #refreshBtn::after{content:'↻';font-size:18px!important}.card:nth-of-type(2) .controls{width:112px!important}.card:nth-of-type(2) .controls select{width:112px!important}
.table-wrap{overflow:visible!important;border:0!important;border-radius:0!important}table{display:block!important;width:100%!important;min-width:0!important}thead{display:none!important}tbody{display:block!important;width:100%!important}

#currentRows tr:not(:has(.empty)) td:nth-child(1){grid-column:1/-1!important;min-height:46px!important;display:block!important;padding:9px 10px!important;border-bottom:1px solid #edf1f5!important;text-align:left!important;background:#fbfdff!important}#currentRows tr:not(:has(.empty)) td:nth-child(1) strong{font-size:11px!important;color:var(--bb-navy)!important}
#currentRows tr:not(:has(.empty)) td:nth-child(2){grid-column:1/-1!important;display:block!important;min-height:28px!important;padding:7px 10px!important;border-bottom:1px solid #edf1f5!important;text-align:left!important;color:var(--bb-muted)!important;font-size:7px!important}#currentRows tr:not(:has(.empty)) td:nth-child(2)::before{content:'Code · ';font-weight:900;text-transform:uppercase}
#currentRows tr:not(:has(.empty)) td:nth-child(n+3){display:flex!important;flex-direction:column!important;align-items:center!important;justify-content:flex-end!important;min-height:51px!important;padding:18px 3px 6px!important;background:#f8fafc!important;border-right:1px solid #edf1f5!important}#currentRows tr:not(:has(.empty)) td:nth-child(6){border-right:0!important}#currentRows tr:not(:has(.empty)) td:nth-child(n+3)::before{position:absolute;top:6px;left:2px;right:2px;color:var(--bb-muted);font-size:5.3px;font-weight:900;text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}#currentRows tr:not(:has(.empty)) td:nth-child(3)::before{content:'Damaged Qty'}#currentRows tr:not(:has(.empty)) td:nth-child(4)::before{content:'Unit'}#currentRows tr:not(:has(.empty)) td:nth-child(5)::before{content:'Avg Cost'}#currentRows tr:not(:has(.empty)) td:nth-child(6)::before{content:'Damage Value'}#currentRows tr:not(:has(.empty)) td:nth-child(3){color:var(--bb-red)!important;font-weight:900!important}#currentRows tr:not(:has(.empty)) td:nth-child(6){color:var(--bb-red)!important;font-weight:900!important}
/* recent entries -> approved card language */
#historyRows tr:not(:has(.empty)){position:relative!important;display:grid!important;grid-template-columns:repeat(4,minmax(0,1fr))!important;width:100%!important;margin:0 0 7px!important;border:1px solid var(--bb-line)!important;border-radius:12px!important;background:#fff!important;overflow:hidden!important}#historyRows tr:not(:has(.empty)) td{position:relative!important;min-width:0!important;padding:0!important;border:0!important;font-size:8px!important;text-align:left!important}
#historyRows tr:not(:has(.empty)) td:nth-child(3){grid-column:1/-1!important;min-height:48px!important;padding:9px 90px 8px 10px!important;border-bottom:1px solid #edf1f5!important;background:#fbfdff!important}#historyRows tr:not(:has(.empty)) td:nth-child(3) strong{display:block!important;color:var(--bb-navy)!important;font-size:10px!important}#historyRows tr:not(:has(.empty)) td:nth-child(3) .muted{margin-top:3px!important;font-size:6.5px!important}
#historyRows tr:not(:has(.empty)) td:nth-child(2){position:absolute!important;right:9px!important;top:9px!important;padding:0!important;z-index:2!important}.badge{padding:4px 7px!important;font-size:6.5px!important}
#historyRows tr:not(:has(.empty)) td:nth-child(1),#historyRows tr:not(:has(.empty)) td:nth-child(4),#historyRows tr:not(:has(.empty)) td:nth-child(5),#historyRows tr:not(:has(.empty)) td:nth-child(6),#historyRows tr:not(:has(.empty)) td:nth-child(7),#historyRows tr:not(:has(.empty)) td:nth-child(8),#historyRows tr:not(:has(.empty)) td:nth-child(9),#historyRows tr:not(:has(.empty)) td:nth-child(10){display:flex!important;flex-direction:column!important;justify-content:flex-end!important;min-height:48px!important;padding:17px 6px 6px!important;border-right:1px solid #edf1f5!important;border-bottom:1px solid #edf1f5!important;background:#fff!important}#historyRows tr:not(:has(.empty)) td:nth-child(1){grid-column:1/3!important}#historyRows tr:not(:has(.empty)) td:nth-child(4){grid-column:3/5!important;text-align:right!important}#historyRows tr:not(:has(.empty)) td:nth-child(5){grid-column:1/3!important}#historyRows tr:not(:has(.empty)) td:nth-child(6){grid-column:3/5!important}#historyRows tr:not(:has(.empty)) td:nth-child(7){grid-column:1/3!important}#historyRows tr:not(:has(.empty)) td:nth-child(8){grid-column:3/5!important}#historyRows tr:not(:has(.empty)) td:nth-child(9){grid-column:1/4!important;border-bottom:0!important}#historyRows tr:not(:has(.empty)) td:nth-child(10){grid-column:4/5!important;border-right:0!important;border-bottom:0!important;text-align:right!important;font-weight:900!important;color:var(--bb-red)!important}
#historyRows tr:not(:has(.empty)) td:nth-child(1)::before,#historyRows tr:not(:has(.empty)) td:nth-child(4)::before,#historyRows tr:not(:has(.empty)) td:nth-child(5)::before,#historyRows tr:not(:has(.empty)) td:nth-child(6)::before,#historyRows tr:not(:has(.empty)) td:nth-child(7)::before,#historyRows tr:not(:has(.empty)) td:nth-child(8)::before,#historyRows tr:not(:has(.empty)) td:nth-child(9)::before,#historyRows tr:not(:has(.empty)) td:nth-child(10)::before{position:absolute;top:5px;left:6px;right:6px;color:var(--bb-muted);font-size:5.2px;font-weight:900;text-transform:uppercase}#historyRows tr:not(:has(.empty)) td:nth-child(1)::before{content:'Date'}#historyRows tr:not(:has(.empty)) td:nth-child(4)::before{content:'Qty'}#historyRows tr:not(:has(.empty)) td:nth-child(5)::before{content:'Batch'}#historyRows tr:not(:has(.empty)) td:nth-child(6)::before{content:'Location'}#historyRows tr:not(:has(.empty)) td:nth-child(7)::before{content:'Controller'}#historyRows tr:not(:has(.empty)) td:nth-child(8)::before{content:'Reference'}#historyRows tr:not(:has(.empty)) td:nth-child(9)::before{content:'Note'}#historyRows tr:not(:has(.empty)) td:nth-child(10)::before{content:'Value';text-align:right}
.empty{display:block!important;width:100%!important;padding:22px 10px!important;border:1px solid var(--bb-line)!important;border-radius:10px!important;background:#fff!important;text-align:center!important;font-size:9px!important}.last{margin-top:6px!important;font-size:7px!important}
@media(max-width:390px){.page{padding:6px!important}.title{font-size:18px!important}.kpis{gap:4px!important}.kpi{padding:7px 5px!important}.kpi strong{font-size:13px!important}.card{padding:7px!important}.card-title{grid-template-columns:1fr!important}.card:first-of-type .controls,.card:nth-of-type(2) .controls{width:100%!important}.card:nth-of-type(2) .controls select{width:100%!important}}
`;
const PATCH=String.raw`
(function(){
'use strict';
document.body.classList.add('bb-damage-stock-mobile');
const title=document.querySelector('.title');if(title)title.textContent='📊 Damage Stock Report';
const refresh=document.getElementById('refreshBtn');if(refresh){refresh.title='Refresh Damage Stock';refresh.setAttribute('aria-label','Refresh Damage Stock')}
})();
`;
try{
 const response=await fetch('damage-stock-report.html?v=20260915-mobile-1',{cache:'no-store'});
 if(!response.ok)throw new Error('Could not load Damage Stock Report source.');
 let html=await response.text();
 const h=html.toLowerCase().indexOf('</head>');if(h<0)throw new Error('Damage Stock source missing </head>.');
 html=html.slice(0,h)+'<style id="bbDamageStockMobileStyle">'+MOBILE_STYLE+'</style>\n'+html.slice(h);
 const b=html.toLowerCase().lastIndexOf('</body>');if(b<0)throw new Error('Damage Stock source missing </body>.');
 html=html.slice(0,b)+'<script>'+PATCH.replace(/<\/script/gi,'<\\/script')+'<\/script>\n'+html.slice(b);
 document.open();document.write(html);document.close();
}catch(error){document.body.innerHTML='<div class="bb-loader"><div class="bb-loader-card">Damage Stock Report could not load.<span>'+String(error&&error.message||error)+'</span></div></div>'}
})();
</script>
</body>
</html>
