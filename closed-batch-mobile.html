<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>BIG BROTHER — Closed Batch Mobile</title>
<style>
html,body{margin:0;min-height:100%;background:#eef3f8;font-family:Arial,sans-serif}
.bb-loader{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;box-sizing:border-box}
.bb-loader-card{width:min(420px,100%);padding:20px;border:1px solid #d8e3ef;border-radius:14px;background:#fff;box-shadow:0 10px 32px rgba(23,63,119,.10);color:#173f77;font-weight:900;text-align:center}
.bb-loader-card span{display:block;margin-top:7px;color:#6d7f93;font-size:11px;font-weight:700}
</style>
</head>
<body>
<div class="bb-loader"><div class="bb-loader-card">Loading Closed Batch…<span>Permanent completed batch history · Mobile workspace</span></div></div>
<script>
(async function(){
'use strict';
try{
  const response=await fetch('batch-mobile.html?v=20260923-batchedit2',{cache:'no-store'});
  if(!response.ok)throw new Error('Could not load Batch mobile source.');
  let html=await response.text();
  html=html.replace(/<title>BIG BROTHER — Batch Report Mobile<\/title>/i,'<title>BIG BROTHER — Closed Batch Mobile<\/title>');
  html=html.replace("window.BB_BATCH_PAGE_MODE='live'","window.BB_BATCH_PAGE_MODE='closed'");
  document.open();
  document.write(html);
  document.close();
}catch(error){
  document.body.innerHTML='<div class="bb-loader"><div class="bb-loader-card">Closed Batch could not load.<span>'+String(error&&error.message||error)+'</span></div></div>';
}
})();
</script>
</body>
</html>
